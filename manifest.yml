team_name: "5GenData"

tracks_addressed:
  - "Data Insights & Visualization"
  - "Policy & Intervention Design"

problem_statements:
  - "Identifying weakest mathematical competencies by district and distinguishing socio-economic disadvantage from targeted instructional gaps"

outputs:
  - file: "outputs/figures/chart_competency_group_overall.png"
    description: "Statewide accuracy by competency group, showing Measurement, Division, and Place Value as the weakest three groups"
  - file: "outputs/figures/chart_district_competency_heatmap.png"
    description: "District x competency group accuracy heatmap across all 30 districts"
  - file: "outputs/figures/chart_district_severity_clustered.png"
    description: "District severity gap (strongest vs weakest competency), colored by weakest competency group"
  - file: "outputs/tables/district_severity_ranked.csv"
    description: "Per-district weakest competency group, severity gap, and rank"
  - file: "outputs/tables/district_competency_with_nfhs.csv"
    description: "District competency scores joined with NFHS-5 female literacy and school attendance indicators"